# Machine: Ender 3v2
# Board: BIGTREETECH SKR mini E3 v3
# MCU: STM32G0B1
# Owner: Moritz Rotheneder
# Created: 4.5.2025

###########################################################
##                        Include                        ##
###########################################################

[include mainsail.cfg]
[include macros.cfg]
#[include KAMP_Settings.cfg]
#[include adxl.cfg]
#[include macros.cfg]


###########################################################
##                         Probe                         ##
###########################################################

[exclude_object]

#[include ./KAMP/Adaptive_Meshing.cfg]



[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -39
y_offset: -11
#z_offset: 2.20   # 2.16 #1.66 #groser ist naher bein bett
stow_on_each_sample: True
speed: 30

[safe_z_home]
home_xy_position: 151,120 # Nozzle coordinates
speed: 200
z_hop: 4   
z_hop_speed: 30

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 17, 13
mesh_max: 210, 217
#mesh_min: 0, 0
#mesh_max: 210, 220
probe_count: 16, 16
#mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.2


###########################################################
##                        Stepper                        ##
###########################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 64
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 249
homing_speed: 100

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 64
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 231
homing_speed: 100

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 64
rotation_distance: 8
#endstop_pin: ^PC2
#position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 235

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 64
rotation_distance: 23.26
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5.0
max_extrude_only_distance: 500
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 250


###########################################################
##                    Stepper drivers                    ##
###########################################################

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650


###########################################################
##                         Other                         ##
###########################################################

[neopixel neo]
pin: PA8
chain_count: 144
color_order: GRB
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2100590004504E5238363120-if00

[printer]
kinematics: cartesian
max_velocity: 400  #300
max_accel: 4000  #3000
max_z_velocity: 10  #5
max_z_accel: 100

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[screws_tilt_adjust]
screw1: 66, 35
screw1_name: vorne links
screw2: 235, 35
screw2_name: vorne rechts
screw3: 235, 206
screw3_name: hinten rechts
screw4: 66, 206
screw4_name: hinten links
horizontal_move_z: 10
speed: 100
screw_thread: CW-M3

